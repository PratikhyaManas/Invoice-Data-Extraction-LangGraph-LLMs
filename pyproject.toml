[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "invoice-extraction-databricks"
version = "1.0.0"
description = "Modular, reusable LangGraph pipeline for AI-powered invoice data extraction on Databricks (Unity Catalog + Delta Lake)."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "Apache-2.0" }

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-ra --cov=invoice_extraction --cov-report=term-missing"

[tool.ruff]
line-length = 110
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "S"]  # "S" = flake8-bandit rules, adds lightweight SAST at lint time
ignore = ["E501"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S101", "S105", "S106"]  # allow assert / dummy secrets in tests

[tool.black]
line-length = 110
target-version = ["py310", "py311", "py312"]

[tool.mypy]
python_version = "3.10"
ignore_missing_imports = true
warn_unused_ignores = true
no_implicit_optional = true

[tool.bandit]
exclude_dirs = ["tests", ".venv", "build"]
skips = []
